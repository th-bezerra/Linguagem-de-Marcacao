<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>position: relative;</title>
    <style>
        .static{
            position: static;
            border: 3px solid #73ad21;
            margin-top: 10%;
        }
        .relative{
            position: relative;
            margin-left: 30px;
            border: 3px solid #73ad21;
        }
    </style>
</head>
<body>
    <h2>position: relative;</h2>
    <p>Segue o fluxo padrão do documento.</p>
    <div class="static">
        Essa div tem o estilo postion: static;
    </div>
    <div class="relative">
        Essa div tem o estilo postion: relative;
    </div>
</body>
</html>
