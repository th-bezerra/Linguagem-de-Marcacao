<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Exemplo 2 - Table</title>
	</head>
	<body>
		<table border ="1" width="100%">
			<tr style="background-color:purple; color: white">
			<th>Cabeçalho 1</th>
			<th>Cabeçalho 2</th>
			<th>Cabeçalho 3</th>
			</tr>
			<tr>
				<td style="background-color:#000;color:#FFF;">Conteúdo 1</td>
				<td>
					<table border="1" width="100%">
						<tr>
							<td style="background-color: yellow;">1</td>
							<td style="background-color: red; color: #FFF; text-align:right;">2</td>
						</tr>
						<tr>
							<td style="background-color: blue; color: #FFF; text-align:right;">3</td>
							<td style="background-color: greenyellow;">4</td>
						</tr>
					</table>
				</td>
				<td style="background-image:url('https://i.pinimg.com/474x/a4/74/fd/a474fdb574fd88ba05900ce6d39573db.jpg');">Conteúdo 3</td>	
			</tr>
			<tr>
				<td style="background-color:#000;color:#FFF;">Conteúdo 4</td>
				<td style="background-image:url('https://images.tcdn.com.br/img/img_prod/620948/papel_de_parede_adesivo_chevron_zig_zag_listras_cinza_e_branco_ssch_089_1901_1_21c81cd3baa7f9c7a4ba8c1ebecf160b.jpg');text-align:right;">Conteúdo 5</td>
				<td>
					<table border="1" width="100%">
						<tr>
							<td style="background-color: orange; color: #000; text-align:center">5</td>
							<td style="background-color: pink; color: #000">6</td>
						</tr>
						<tr>
							<td style="background-color: #BB1B80; color: #FFF; text-align:right;">7</td>
							<td style="background-color: orange; color: #000; text-align:center;">8</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
		
	</body
</html>
